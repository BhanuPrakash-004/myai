name: myai-tests
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_USER: myai_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: myai_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myai_test -d myai_test"]
      interval: 2s
      timeout: 3s
      retries: 30
